---
layout: default
---

<article class="post">
  <header>
    <h1>{{ page.title }}</h1>
    <p class="meta">{{ page.date | date: "%B %d, %Y" }}</p>
  </header>

  <section class="post-content">
    {{ content }}
  </section>

  <footer>
    {% if page.tags %}
      <p>Tags: 
        {% for tag in page.tags %}
          <a href="{{ '/tags/' | append: tag | relative_url }}">{{ tag }}</a>{% unless forloop.last %}, {% endunless %}
        {% endfor %}
      </p>
    {% endif %}
  </footer>
</article>
